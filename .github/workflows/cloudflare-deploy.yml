name: Deploy to Cloudflare (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify Cloudflare deployment policy
        run: node .github/scripts/check-cloudflare-deployment.mjs

      - name: Enforce registered Cloudflare target and credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_TARGET_VERIFIED: ${{ vars.CLOUDFLARE_TARGET_VERIFIED }}
        run: |
          if [ "$CLOUDFLARE_TARGET_VERIFIED" != "true" ]; then
            echo "::error::Cloudflare deployment blocked: target is not verified in C:\\Project\\docs\\cloudflare-targets.json."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Cloudflare deployment blocked: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are required."
            exit 1
          fi
          node .github/scripts/check-cloudflare-deployment.mjs --for-deploy
      - name: Install dependencies
        shell: bash
        run: |
          npm ci
          pip install -r requirements.txt

      - name: Build and test Cloudflare artifact
        shell: bash
        run: |
          python site/build_site.py
          npm run cloudflare:check

      - name: Deploy production to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.jsonc

      - name: Verify Cloudflare production
        shell: bash
        run: |
          python scripts/verify_codex_update_production.py --attempts 20 --interval 10
