name: Update Codex evergreen blog

on:
  schedule:
    # OpenAI公式更新を毎朝JST 07:40に確認する。差分がなければAI APIは呼ばない。
    - cron: "40 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: codex-update-log
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test fail-closed updater
        run: python -m unittest tests.test_codex_update_log_updater

      - name: Refresh fixed Codex article from official digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/update_codex_update_log.py

      - name: Verify article contract
        run: python -m unittest tests.test_codex_update_log_updater tests.test_codex_update_production_verifier tests.test_blog_freshness

      - name: Verify site build
        env:
          AIWATCH_PORTFOLIO_NO_FETCH: "1"
        run: python site/build_site.py

      - name: Commit source only when updated
        id: commit
        run: |
          git restore --worktree -- site/dist outputs/agents_status.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/blog/codex-update-log.md
          if git diff --staged --quiet; then
            echo "Codex公式情報に変更なし"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(blog): refresh Codex update log"
            git pull --rebase origin main
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify Vercel production fingerprint
        run: python scripts/verify_codex_update_production.py
