<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" aria-labelledby="title desc">
  <title id="title">AIオンラインサロンのライブトーク参加イメージ</title>
  <desc id="desc">オープンチャットを開き、リスナーとして参加し、話すときだけ挙手する3ステップを示したスマートフォン画面</desc>
  <defs>
    <linearGradient id="bg" x1="56" y1="24" x2="584" y2="456" gradientUnits="userSpaceOnUse">
      <stop stop-color="#eef3ff"/>
      <stop offset="1" stop-color="#f9fbff"/>
    </linearGradient>
    <linearGradient id="live" x1="116" y1="127" x2="340" y2="173" gradientUnits="userSpaceOnUse">
      <stop stop-color="#075fc8"/>
      <stop offset="1" stop-color="#5367d9"/>
    </linearGradient>
    <filter id="shadow" x="55" y="18" width="352" height="446" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#27365f" flood-opacity=".16"/>
    </filter>
  </defs>

  <rect x="8" y="8" width="624" height="464" rx="30" fill="url(#bg)"/>
  <circle cx="577" cy="66" r="48" fill="#dce8ff" opacity=".72"/>
  <circle cx="560" cy="418" r="74" fill="#ece9ff" opacity=".82"/>
  <path d="M405 62c38-28 87-28 126 0" fill="none" stroke="#cbd9f2" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 10"/>

  <g filter="url(#shadow)">
    <rect x="84" y="27" width="298" height="426" rx="40" fill="#121c31"/>
    <rect x="94" y="38" width="278" height="404" rx="32" fill="#fff"/>
  </g>
  <rect x="187" y="47" width="92" height="8" rx="4" fill="#c8d1df"/>

  <g font-family="'Noto Sans JP','Yu Gothic',sans-serif">
    <text x="116" y="91" fill="#1a2940" font-size="15" font-weight="800">AIオンラインサロン</text>
    <text x="116" y="112" fill="#55657c" font-size="10" font-weight="700">毎週火曜 21:00</text>

    <rect x="112" y="130" width="242" height="54" rx="15" fill="url(#live)"/>
    <circle cx="136" cy="157" r="8" fill="#fff"/>
    <circle cx="136" cy="157" r="13" fill="none" stroke="#fff" stroke-opacity=".34" stroke-width="2"/>
    <text x="158" y="153" fill="#fff" font-size="10" font-weight="900" letter-spacing="1.1">LIVE TALK</text>
    <text x="158" y="170" fill="#fff" font-size="12" font-weight="800">開催中の案内をタップ</text>

    <circle cx="174" cy="235" r="32" fill="#edf3ff" stroke="#d8e3f7" stroke-width="2"/>
    <circle cx="234" cy="235" r="32" fill="#f1efff" stroke="#dfdaf8" stroke-width="2"/>
    <circle cx="294" cy="235" r="32" fill="#fff1f4" stroke="#f3d8df" stroke-width="2"/>
    <path d="M160 237c0-10 6-17 14-17s14 7 14 17" fill="none" stroke="#075fc8" stroke-width="5" stroke-linecap="round"/>
    <rect x="157" y="234" width="7" height="14" rx="3.5" fill="#075fc8"/>
    <rect x="184" y="234" width="7" height="14" rx="3.5" fill="#075fc8"/>
    <path d="M224 242v-17m10 17v-24m10 24v-13" stroke="#5367d9" stroke-width="5" stroke-linecap="round"/>
    <path d="M282 244c-6-6-7-15-1-21l5-5 2 12 5-15 5 17 4-10c7 7 5 18-2 24-6 5-13 6-18-2Z" fill="#e2394f"/>
    <text x="233" y="289" fill="#55657c" font-size="10" text-anchor="middle" font-weight="700">マイクOFFで聞けます</text>

    <rect x="112" y="311" width="242" height="48" rx="14" fill="#075fc8"/>
    <text x="233" y="341" fill="#fff" font-size="13" text-anchor="middle" font-weight="900">リスナーとして参加</text>

    <rect x="112" y="373" width="112" height="42" rx="13" fill="#f3f6fb" stroke="#d8e1ef"/>
    <path d="M137 397v-10m7 10v-14m7 14v-12m7 12v-8c6 6 5 14-1 19-8 7-20 3-20-8Z" fill="none" stroke="#075fc8" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="178" y="399" fill="#1a2940" font-size="11" font-weight="800">挙手</text>
    <rect x="235" y="373" width="119" height="42" rx="13" fill="#fff" stroke="#d8e1ef"/>
    <path d="M258 388v9m-5-5v5a5 5 0 0 0 10 0v-5" fill="none" stroke="#55657c" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M250 401h16" stroke="#55657c" stroke-width="2.4" stroke-linecap="round"/>
    <text x="289" y="399" fill="#55657c" font-size="11" font-weight="800">マイクOFF</text>

    <path d="M354 157H414" stroke="#9bb4dc" stroke-width="2" stroke-linecap="round"/>
    <circle cx="426" cy="157" r="16" fill="#075fc8"/>
    <text x="426" y="162" fill="#fff" font-size="13" text-anchor="middle" font-weight="900">1</text>
    <text x="454" y="153" fill="#1a2940" font-size="13" font-weight="900">開催案内を開く</text>
    <text x="454" y="171" fill="#55657c" font-size="10" font-weight="700">トーク内のバーをタップ</text>

    <path d="M354 335H414" stroke="#9bb4dc" stroke-width="2" stroke-linecap="round"/>
    <circle cx="426" cy="335" r="16" fill="#075fc8"/>
    <text x="426" y="340" fill="#fff" font-size="13" text-anchor="middle" font-weight="900">2</text>
    <text x="454" y="331" fill="#1a2940" font-size="13" font-weight="900">リスナーで参加</text>
    <text x="454" y="349" fill="#55657c" font-size="10" font-weight="700">まずは聞くだけでOK</text>

    <path d="M354 394H414" stroke="#9bb4dc" stroke-width="2" stroke-linecap="round"/>
    <circle cx="426" cy="394" r="16" fill="#075fc8"/>
    <text x="426" y="399" fill="#fff" font-size="13" text-anchor="middle" font-weight="900">3</text>
    <text x="454" y="390" fill="#1a2940" font-size="13" font-weight="900">話す時だけ挙手</text>
    <text x="454" y="408" fill="#55657c" font-size="10" font-weight="700">承認後にマイクをオン</text>
  </g>
</svg>
