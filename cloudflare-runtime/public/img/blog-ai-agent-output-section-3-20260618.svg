<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">目的がAIエージェントを動かす</title>
  <desc id="desc">明確な目的からAIエージェントの作業が分岐し、成果物へつながる流れ。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4FAFF"/>
      <stop offset="1" stop-color="#FFF2DA"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#1A3840" flood-opacity=".14"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <path d="M600 168v120M600 288H318M600 288h282M318 288v138M600 288v138M882 288v138" fill="none" stroke="#9AB5B8" stroke-width="12" stroke-linecap="round"/>
  <g filter="url(#shadow)">
    <circle cx="600" cy="144" r="94" fill="#102F39"/>
    <circle cx="600" cy="144" r="58" fill="#FFFFFF"/>
    <circle cx="600" cy="144" r="24" fill="#F2A541"/>
    <text x="600" y="276" text-anchor="middle" fill="#102F39" font-family="sans-serif" font-size="34" font-weight="900">目的が先</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="172" y="424" width="292" height="150" rx="28" fill="#FFFFFF"/>
    <text x="318" y="488" text-anchor="middle" fill="#17363A" font-family="sans-serif" font-size="28" font-weight="800">予約導線</text>
    <path d="M234 526h168" stroke="#0E9F8F" stroke-width="14" stroke-linecap="round"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="454" y="424" width="292" height="150" rx="28" fill="#FFFFFF"/>
    <text x="600" y="488" text-anchor="middle" fill="#17363A" font-family="sans-serif" font-size="28" font-weight="800">資料化</text>
    <path d="M522 526h156M522 552h102" stroke="#E59A32" stroke-width="14" stroke-linecap="round"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="736" y="424" width="292" height="150" rx="28" fill="#FFFFFF"/>
    <text x="882" y="488" text-anchor="middle" fill="#17363A" font-family="sans-serif" font-size="28" font-weight="800">数字確認</text>
    <rect x="808" y="518" width="28" height="44" rx="6" fill="#0E9F8F"/>
    <rect x="856" y="492" width="28" height="70" rx="6" fill="#F2A541"/>
    <rect x="904" y="532" width="28" height="30" rx="6" fill="#8CA0AC"/>
  </g>
  <text x="600" y="642" text-anchor="middle" fill="#405F65" font-family="sans-serif" font-size="24" font-weight="700">やる気より、目的と確認の置き方で進み方が変わる</text>
</svg>
