<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">専門知識をAIで増幅する</title>
  <desc id="desc">現場経験や専門知識がAIによって設計、実装、運用へ広がる図。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7FBFF"/>
      <stop offset=".54" stop-color="#F2F8F2"/>
      <stop offset="1" stop-color="#FFF0D6"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0E9F8F"/>
      <stop offset="1" stop-color="#F2A541"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="18" flood-color="#1A3038" flood-opacity=".15"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <g filter="url(#shadow)">
    <rect x="90" y="156" width="288" height="362" rx="36" fill="#FFFFFF"/>
    <text x="234" y="230" text-anchor="middle" fill="#14343C" font-family="sans-serif" font-size="32" font-weight="900">専門知識</text>
    <circle cx="234" cy="316" r="58" fill="#EAF7F4"/>
    <path d="M206 318h56M234 290v56" stroke="#0E9F8F" stroke-width="14" stroke-linecap="round"/>
    <text x="234" y="420" text-anchor="middle" fill="#4B676C" font-family="sans-serif" font-size="22" font-weight="700">経験・判断・現場感</text>
  </g>
  <path d="M400 336h400" stroke="url(#beam)" stroke-width="34" stroke-linecap="round"/>
  <path d="M760 284l72 52-72 52" fill="none" stroke="#F2A541" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
  <g filter="url(#shadow)">
    <rect x="822" y="116" width="292" height="450" rx="36" fill="#FFFFFF"/>
    <text x="968" y="190" text-anchor="middle" fill="#14343C" font-family="sans-serif" font-size="32" font-weight="900">増幅された成果</text>
    <g fill="#102F39" font-family="sans-serif" font-size="24" font-weight="800">
      <text x="890" y="270">設計</text>
      <text x="890" y="330">実装</text>
      <text x="890" y="390">レビュー</text>
      <text x="890" y="450">運用</text>
    </g>
    <g stroke="#0E9F8F" stroke-width="12" stroke-linecap="round">
      <path d="M1030 260l28 28 48-66"/>
      <path d="M1030 320l28 28 48-66"/>
      <path d="M1030 380l28 28 48-66"/>
      <path d="M1030 440l28 28 48-66"/>
    </g>
  </g>
  <text x="600" y="620" text-anchor="middle" fill="#405F65" font-family="sans-serif" font-size="25" font-weight="800">AIを使っただけではなく、知識を成果へ変換する</text>
</svg>
