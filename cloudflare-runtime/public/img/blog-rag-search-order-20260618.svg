<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Search order matters</title>
  <desc id="desc">A RAG design chooses which information sources the agent should inspect first.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#ecfdf5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.13"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <text x="82" y="112" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="900" fill="#102033">Design the order of attention</text>
  <text x="84" y="154" font-family="Inter, Arial, sans-serif" font-size="21" fill="#64748b">More files do not help unless the agent knows what to inspect first.</text>
  <g transform="translate(84 238)" filter="url(#shadow)">
    <rect width="170" height="110" rx="18" fill="#ffffff" stroke="#d8e2ee" stroke-width="3"/>
    <text x="24" y="44" font-family="Inter, Arial, sans-serif" font-size="18" fill="#64748b">01</text>
    <text x="24" y="79" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="900" fill="#1d4ed8">Sales</text>
  </g>
  <g transform="translate(292 238)" filter="url(#shadow)">
    <rect width="170" height="110" rx="18" fill="#ffffff" stroke="#d8e2ee" stroke-width="3"/>
    <text x="24" y="44" font-family="Inter, Arial, sans-serif" font-size="18" fill="#64748b">02</text>
    <text x="24" y="79" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="900" fill="#047857">Margin</text>
  </g>
  <g transform="translate(500 238)" filter="url(#shadow)">
    <rect width="170" height="110" rx="18" fill="#ffffff" stroke="#d8e2ee" stroke-width="3"/>
    <text x="24" y="44" font-family="Inter, Arial, sans-serif" font-size="18" fill="#64748b">03</text>
    <text x="24" y="79" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="900" fill="#c2410c">Stock</text>
  </g>
  <g transform="translate(708 238)" filter="url(#shadow)">
    <rect width="170" height="110" rx="18" fill="#ffffff" stroke="#d8e2ee" stroke-width="3"/>
    <text x="24" y="44" font-family="Inter, Arial, sans-serif" font-size="18" fill="#64748b">04</text>
    <text x="24" y="79" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="900" fill="#7c3aed">Review</text>
  </g>
  <g transform="translate(916 238)" filter="url(#shadow)">
    <rect width="170" height="110" rx="18" fill="#ffffff" stroke="#d8e2ee" stroke-width="3"/>
    <text x="24" y="44" font-family="Inter, Arial, sans-serif" font-size="18" fill="#64748b">05</text>
    <text x="24" y="79" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="900" fill="#b7791f">SEO</text>
  </g>
  <path d="M252 293 H292 M462 293 H500 M670 293 H708 M878 293 H916" stroke="#2563eb" stroke-width="8" stroke-linecap="round" stroke-dasharray="3 18"/>
  <g filter="url(#shadow)">
    <rect x="250" y="456" width="700" height="90" rx="24" fill="#111827"/>
    <text x="306" y="512" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="900" fill="#ffffff">Priority creates better recommendations</text>
  </g>
</svg>
