<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">From asking to thinking design</title>
  <desc id="desc">The value shifts from asking AI questions to designing how AI should reason.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f9fc"/>
      <stop offset="0.55" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eff6ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <text x="82" y="108" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="900" fill="#102033">The question changes</text>
  <g filter="url(#shadow)">
    <rect x="96" y="210" width="280" height="250" rx="28" fill="#ffffff" stroke="#d8e2ee" stroke-width="3"/>
    <text x="136" y="286" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="900" fill="#64748b">Ask AI</text>
    <text x="136" y="340" font-family="Inter, Arial, sans-serif" font-size="20" fill="#64748b">What should I do?</text>
  </g>
  <path d="M410 335 H520" stroke="#2563eb" stroke-width="11" stroke-linecap="round"/>
  <path d="M500 303 L536 335 L500 367" fill="none" stroke="#2563eb" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  <g filter="url(#shadow)">
    <rect x="552" y="176" width="330" height="318" rx="32" fill="#111827"/>
    <text x="602" y="264" font-family="Inter, Arial, sans-serif" font-size="31" font-weight="900" fill="#ffffff">Design thinking</text>
    <text x="602" y="316" font-family="Inter, Arial, sans-serif" font-size="20" fill="#cbd5e1">sources</text>
    <text x="602" y="356" font-family="Inter, Arial, sans-serif" font-size="20" fill="#cbd5e1">order</text>
    <text x="602" y="396" font-family="Inter, Arial, sans-serif" font-size="20" fill="#cbd5e1">criteria</text>
  </g>
  <path d="M912 335 H1010" stroke="#10b981" stroke-width="11" stroke-linecap="round"/>
  <path d="M990 303 L1026 335 L990 367" fill="none" stroke="#10b981" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  <g filter="url(#shadow)">
    <rect x="1042" y="210" width="70" height="250" rx="28" fill="#10b981"/>
    <text x="1070" y="287" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="900" fill="#ffffff" writing-mode="tb">ACTION</text>
  </g>
  <rect x="270" y="566" width="660" height="54" rx="27" fill="#ecfdf5" stroke="#bbf7d0"/>
  <text x="326" y="601" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="900" fill="#047857">Companies compete on organized knowledge</text>
</svg>
