# 講習資料ディレクトリの一覧定義
#
# 編集ガイド:
#   - sections は表示順
#   - 各 section の items に 1 ブロック追加すれば一覧に増える
#   - href の扱い:
#       - https:// で始まる → 外部リンク（自動で別タブ + 「外部」バッジ）
#       - "./xxx.html" / "../xxx.html" → そのまま使われる
#       - "xxx.html"（ルート相対）→ 自動的に "../xxx.html" として解決される
#   - source: lectures-md は特別キーワード
#       content/lectures/*.md を自動取り込む（admin の /lectures 編集タブと連携）
#   - icon / summary / date は省略可
#
# 例: 補助資料を増やす
#   items:
#     - title: 新しい資料名
#       icon: 📒
#       href: 新しい資料.html  # site/static または content から生成された html
#       summary: 1〜2行の説明
#       date: 2026-05-01

sections:

- name: 講習資料
  icon: 📝
  description: 講習で実際に使った資料・スライド（content/lectures/*.md から自動取り込み + 大型コンテンツの手動追加）
  source: lectures-md
  items:
  # 大型 HTML コンテンツ（Markdown 化が難しいので独立 HTML のまま講習資料として並べる）
  - title: AIコーディング総合講習
    icon: 🧭
    href: programming-map.html
    summary: Codex導入からプログラミング基礎、実装、公開運用、AI応用制作、総合演習までを、投影しやすいPowerPoint風LPとして段階的に学ぶ総合講習資料。
    date: 2026-06-05
  # クライミングの歴史 スライド（content/slides/*.md から Marp 生成・/slides/ 配下に公開）
  - title: クライミングの歴史 I（世界史編）
    icon: 🧗
    href: slides/climbing-history-1.html
    summary: 1786年モンブランから種目の分化、パタゴニア／ノースフェイス誕生秘話、五輪採用まで。初心者向け講習スライド（投影用HTML）。PDF・台本は参考資料ページから
    date: 2026-05-23
  - title: クライミングの歴史 II（日本史・ぐっぼる編）
    icon: 🧗
    href: slides/climbing-history-2.html
    summary: 日本のクライミング独立史、ジムの爆発的普及、世界に挑んだ日本人、そして「ぐっぼる」がジム＋ショップ＋カフェである理由。投影用HTML
    date: 2026-05-23

- name: 補助資料
  icon: 📚
  description: 講習を補完する独立コンテンツ
  items: []

- name: 外部リソース
  icon: 🌐
  description: 公式ドキュメント・参考リンク（追加する場合はここへ）
  items: []
