# 受講資料ディレクトリの一覧定義
#
# 編集ガイド:
#   - sections は表示順
#   - 各 section の items に 1 ブロック追加すれば一覧に増える
#   - href の扱い:
#       - https:// で始まる → 外部リンク（自動で別タブ + 「外部」バッジ）
#       - "./xxx.html" / "../xxx.html" → そのまま使われる
#       - "xxx.html"（ルート相対）→ 自動的に "../xxx.html" として解決される
#   - source: lectures-md は特別キーワード
#       content/lectures/*.md を自動取り込む（admin の /lectures 編集タブと連携）
#   - icon / summary / date は省略可
#
# 例: 補助資料を増やす
#   items:
#     - title: 新しい資料名
#       icon: 📒
#       href: 新しい資料.html  # site/static または content から生成された html
#       summary: 1〜2行の説明
#       date: 2026-05-01

sections:

- name: 受講資料
  source: lectures-md
  group_by: category
  groups:
  - key: ai-start
    name: 1. AIが初めての人
    icon: 🌱
    description: 最初の1本と実践ワークの2本だけで、頼み方と確認の基本を身につける
  - key: ai-work
    name: 2. 自社資料をAIで使う
    icon: 🧰
    description: AIに必要な資料を探してもらい、根拠と一緒に答えてもらう方法を学ぶ
  - key: ai-build
    name: 3. AIと一緒に作る
    icon: 🛠️
    description: Claude CodeやCodexへ、小さな修正を安全な順番で頼む方法を学ぶ
  - key: climbing
    name: 4. クライミングを学ぶ
    icon: 🧗
    description: 山、岩、ジム、競技へ広がった流れを、初心者へ説明するための資料

- name: 講師用・詳しく学ぶ資料
  icon: 📚
  description: 講習で画面共有するときや、本文のあとで詳しく確認するときだけ開く補助資料
  collapsed: true
  items:
  - title: AIエージェント講習 120分
    icon: 🧭
    href: programming-map.html
    summary: 初めての人が、CodexやClaude Codeへの頼み方、確認、修正、安全な公開までを順番に学ぶAIエージェント講習。
    date: 2026-06-06
    features:
      body: true
      toc: true
      slides: true
      check: true
  - title: クライミングの歴史 I（世界史編）
    icon: 🧗
    href: slides/climbing-history-1.html
    summary: 1786年モンブランから種目の分化、パタゴニア／ノースフェイス誕生秘話、五輪採用まで。初心者向け講習スライド（投影用HTML）
    date: 2026-05-23
    features:
      slides: true
  - title: クライミングの歴史 II（日本史・ぐっぼる編）
    icon: 🧗
    href: slides/climbing-history-2.html
    summary: 日本のクライミング独立史、ジムの爆発的普及、世界に挑んだ日本人、そして「ぐっぼる」がジム＋ショップ＋カフェである理由。投影用HTML
    date: 2026-05-23
    features:
      slides: true

- name: 外部リソース
  icon: 🌐
  description: 公式情報を直接確認したいときに使う参考リンク
  collapsed: true
  items: []
