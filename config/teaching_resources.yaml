# 受講資料ディレクトリの一覧定義
#
# 編集ガイド:
#   - sections は表示順
#   - 各 section の items に 1 ブロック追加すれば一覧に増える
#   - href の扱い:
#       - https:// で始まる → 外部リンク（自動で別タブ + 「外部」バッジ）
#       - "./xxx.html" / "../xxx.html" → そのまま使われる
#       - "xxx.html"（ルート相対）→ 自動的に "../xxx.html" として解決される
#   - source: lectures-md は特別キーワード
#       content/lectures/*.md を自動取り込む（admin の /lectures 編集タブと連携）
#   - icon / summary / date は省略可
#
# 例: 補助資料を増やす
#   items:
#     - title: 新しい資料名
#       icon: 📒
#       href: 新しい資料.html  # site/static または content から生成された html
#       summary: 1〜2行の説明
#       date: 2026-05-01

sections:

- name: 受講資料
  source: lectures-md
  group_by: category
  groups:
  - key: ai-start
    name: 1. AIエージェント講習とCodex初級
    icon: 🌱
    description: AIエージェント講習120分の中で、Codexへ小さく頼む・確かめる・残す仕事の型を実践する
  - key: ai-work
    name: 2. 自社資料をAIで使う
    icon: 🧰
    description: AIに必要な資料を探してもらい、根拠と一緒に答えてもらう方法を学ぶ
  - key: ai-salon
    name: 3. オンラインサロンで実践する
    icon: 🎙️
    description: 自分の成果を持ち寄り、講師と会員の声で確かめ、次の一手を決める
  - key: climbing
    name: 4. AIの資料作成例
    icon: 🧗
    description: 1つの題材を、AIの作成支援と人の確認でWeb資料・図版・スライド・PDFへ展開した完成例

- name: 講師用・詳しく学ぶ資料
  icon: 📚
  description: 講習で画面共有するときや、本文のあとで詳しく確認するときだけ開く補助資料
  collapsed: true
  items:
  - title: AIアプリサイト自作講習・相談 120分
    icon: 🧭
    href: programming-map.html
    summary: 作りたい内容の相談から始め、CodexやClaude Codeを使った実装、変更確認、修正、安全な公開までを順番に学ぶ自作講習です。
    date: 2026-06-06
    features:
      body: true
      toc: true
      slides: true
      check: true
  - title: クライミングの歴史 I（世界史編）
    icon: 🧗
    href: slides/climbing-history-1.html
    summary: 1786年モンブランから種目の分化、パタゴニア／ノースフェイス誕生秘話、五輪採用まで。初心者向け講習スライド（投影用HTML）
    date: 2026-05-23
    features:
      slides: true
  - title: クライミングの歴史 II（日本史・ぐっぼる編）
    icon: 🧗
    href: slides/climbing-history-2.html
    summary: 日本のクライミング独立史、ジムの爆発的普及、世界に挑んだ日本人、そして「ぐっぼる」がジム＋ショップ＋カフェである理由。投影用HTML
    date: 2026-05-23
    features:
      slides: true

- name: 外部リソース
  icon: 🌐
  description: 公式情報を直接確認したいときに使う参考リンク
  collapsed: true
  items: []
