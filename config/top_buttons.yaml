# 全ページ共通のトップナビ定義
#
# 編集ガイド:
#   - group: 同じグループのボタンが視覚的に隣接して表示される
#   - href: ルート相対 (例: speaker.html / lectures/index.html)
#         → 各ページから呼ばれた時に build_site.py 側で ./ または ../ を付与する
#   - localhost_only: true の項目は本番では非表示、localhost でのみ表示
#   - kind: link | action（action は run ボタンのみ対応）
#
# グループ表示順は最初に現れた順。
#
# Phase 1 変更点:
#   - home (トップ) → CEO ポータル index.html へ
#   - archive → watch/archive.html へ移設
#   - watch (AI Watch) リンクを新規追加

top_buttons:
- id: home
  group: メイン
  label: ポータル
  icon: 🏠
  href: index.html
  kind: link
  enabled: true

- id: speaker
  group: 講師
  label: 講師紹介
  icon: 🎤
  href: speaker.html
  kind: link
  enabled: true
- id: profile
  group: 講師
  label: 経歴
  icon: 📜
  href: profile.html
  kind: link
  enabled: true

- id: portfolio
  group: 作品
  label: 実績
  icon: 🏆
  href: portfolio.html
  kind: link
  enabled: true

- id: lectures
  group: 教材資料
  label: 講習資料
  icon: 📝
  href: lectures/index.html
  kind: link
  enabled: true
- id: pmap
  group: 教材資料
  label: プログラミングマップ
  icon: 🗺
  href: programming-map.html
  kind: link
  enabled: true

- id: watch
  group: AI情報
  label: AI Watch
  icon: 📡
  href: watch/index.html
  kind: link
  enabled: true
- id: archive
  group: AI情報
  label: 過去ログ
  icon: 📚
  href: watch/archive.html
  kind: link
  enabled: true

- id: run
  group: 操作
  label: 巡回実行
  icon: 🔄
  href: ''
  kind: action
  action_id: run
  enabled: true
- id: admin
  group: 操作
  label: 管理ログイン
  icon: 🔐
  href: /admin
  kind: link
  # ヘッダー右端の独立 .login-btn と重複するので非表示。リンクは render_top_nav が
  # ヘッダー右側に常時生成する。
  enabled: false
