# 全ページ共通のトップナビ定義
#
# 編集ガイド:
#   - group: 同じグループのボタンが視覚的に隣接して表示される
#   - href: ルート相対 (例: speaker.html / lectures/index.html)
#         → 各ページから呼ばれた時に build_site.py 側で ./ または ../ を付与する
#   - localhost_only: true の項目は本番では非表示、localhost でのみ表示
#   - kind: link | action（action は run ボタンのみ対応）
#
# グループ表示順は最初に現れた順。
#
# Phase 1 変更点:
#   - home (ホーム) → CEO ポータル index.html へ
#   - archive → watch/archive.html へ移設
#   - watch (AI Watch) リンクを新規追加

top_buttons:
- id: home
  group: メイン
  label: ホーム
  icon: 🏠
  href: index.html
  kind: link
  enabled: true

- id: speaker
  group: 講師
  label: 講師紹介
  icon: 🎤
  href: speaker.html
  kind: link
  enabled: true
- id: profile
  group: 講師
  label: 人物メモ
  icon: 📜
  href: speaker.html
  kind: link
  enabled: false

- id: portfolio
  group: 資料
  label: 運営メモ
  icon: 🧭
  href: index.html#flow
  kind: link
  enabled: false

- id: lectures
  group: 教材資料
  label: 受講資料
  icon: 📝
  href: lectures/index.html
  kind: link
  enabled: true
- id: agent_course
  group: 教材資料
  label: AIエージェント講習
  icon: 🤖
  href: lectures/2026-04-ai-kihon.html
  kind: link
  enabled: true

- id: watch
  group: AI情報
  label: SNSポータル
  icon: 📡
  href: watch/index.html
  kind: link
  enabled: true
- id: archive
  group: AI情報
  label: 過去ログ
  icon: 📚
  href: watch/archive.html
  kind: link
  enabled: true

- id: run
  group: 操作
  label: 巡回実行
  icon: 🔄
  href: ''
  kind: action
  action_id: run
  enabled: true
- id: admin
  group: 操作
  label: 会員ログイン
  icon: 🔐
  href: /admin
  kind: link
  # ヘッダーの独立 .header-member-login と重複するので非表示。リンクは render_top_nav が
  # 固定ヘッダーに常時生成する。
  enabled: false
