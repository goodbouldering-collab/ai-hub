<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">AI成果物の選別</title>
  <desc id="desc">AIが生成した多数の成果物を、人間が目的に合わせて選別する様子。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F5FBFF"/>
      <stop offset="0.56" stop-color="#EAF7F4"/>
      <stop offset="1" stop-color="#FFF4DD"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E9F8F"/>
      <stop offset="1" stop-color="#F2A541"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#14313A" flood-opacity=".16"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1020" cy="88" r="150" fill="#FFFFFF" opacity=".62"/>
  <circle cx="122" cy="560" r="190" fill="#CDEFEA" opacity=".46"/>
  <g filter="url(#shadow)">
    <rect x="92" y="88" width="640" height="448" rx="34" fill="#FFFFFF"/>
    <rect x="128" y="128" width="190" height="120" rx="20" fill="#E8F7F4"/>
    <rect x="344" y="128" width="190" height="120" rx="20" fill="#FFF1D5"/>
    <rect x="560" y="128" width="136" height="120" rx="20" fill="#F1F4F8"/>
    <rect x="128" y="276" width="190" height="120" rx="20" fill="#F1F4F8"/>
    <rect x="344" y="276" width="190" height="120" rx="20" fill="#EAF3FF"/>
    <rect x="560" y="276" width="136" height="120" rx="20" fill="#E8F7F4"/>
    <rect x="128" y="424" width="568" height="72" rx="22" fill="#102F39"/>
    <text x="160" y="469" fill="#FFFFFF" font-family="sans-serif" font-size="28" font-weight="700">作れる量より、選べる力</text>
    <g fill="#102F39" opacity=".78" font-family="sans-serif" font-size="18" font-weight="700">
      <text x="158" y="176">LP案</text>
      <text x="374" y="176">資料案</text>
      <text x="590" y="176">画像案</text>
      <text x="158" y="324">台本</text>
      <text x="374" y="324">管理画面</text>
      <text x="590" y="324">投稿</text>
    </g>
    <path d="M174 214h90M390 214h90M606 214h52M174 362h90M390 362h90M606 362h52" stroke="#91A8AF" stroke-width="10" stroke-linecap="round"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="780" y="122" width="300" height="420" rx="38" fill="#FFFFFF"/>
    <circle cx="930" cy="230" r="78" fill="url(#accent)"/>
    <path d="M884 231l32 32 64-76" fill="none" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="930" y="356" text-anchor="middle" fill="#10313B" font-family="sans-serif" font-size="34" font-weight="800">人間が採用判断</text>
    <text x="930" y="402" text-anchor="middle" fill="#45636B" font-family="sans-serif" font-size="22" font-weight="700">目的に合うものだけを残す</text>
    <rect x="836" y="448" width="188" height="18" rx="9" fill="#DCE8EA"/>
    <rect x="836" y="482" width="128" height="18" rx="9" fill="#F0C777"/>
  </g>
</svg>
