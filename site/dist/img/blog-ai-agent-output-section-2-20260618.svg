<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">量産されたAIアプリの整理</title>
  <desc id="desc">大量に生まれるAI成果物を、作物のように育てるものと整理するものへ分ける図。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6FCFF"/>
      <stop offset="1" stop-color="#F7F0DF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#243B36" flood-opacity=".14"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <path d="M0 468c174-62 349-62 524 0s386 65 676-12v219H0z" fill="#DDEFD2"/>
