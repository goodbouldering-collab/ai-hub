  <path d="M776 245 C695 222 665 234 634 268" fill="none" stroke="#10b981" stroke-width="8" stroke-linecap="round"/>
  <path d="M424 485 C505 508 535 496 566 432" fill="none" stroke="#f97316" stroke-width="8" stroke-linecap="round"/>
  <path d="M776 485 C695 508 665 496 634 432" fill="none" stroke="#7c3aed" stroke-width="8" stroke-linecap="round"/>
  <rect x="444" y="584" width="312" height="48" rx="24" fill="#10b981"/>
