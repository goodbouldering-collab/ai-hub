<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">RAG library and AI agent</title>
  <desc id="desc">An AI agent retrieves useful knowledge from organized business sources.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef7ff"/>
      <stop offset="0.55" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#edf9f3"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1010" cy="110" r="88" fill="#2563eb" opacity="0.08"/>
  <circle cx="160" cy="575" r="110" fill="#10b981" opacity="0.09"/>
  <g filter="url(#shadow)">
    <rect x="84" y="112" width="410" height="452" rx="24" fill="#ffffff" stroke="#d8e2ee" stroke-width="3"/>
    <text x="124" y="166" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="800" fill="#102033">RAG Library</text>
    <text x="126" y="203" font-family="Inter, Arial, sans-serif" font-size="17" fill="#64748b">Documents, data, and business memory</text>
    <rect x="128" y="246" width="320" height="54" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="154" y="281" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#1d4ed8">PDF / Manuals</text>
    <rect x="128" y="322" width="320" height="54" rx="12" fill="#ecfdf5" stroke="#bbf7d0"/>
    <text x="154" y="357" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#047857">Sales / Stock</text>
    <rect x="128" y="398" width="320" height="54" rx="12" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="154" y="433" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#c2410c">Reviews / SEO</text>
    <rect x="128" y="474" width="320" height="54" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="154" y="509" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#334155">Customers / CRM</text>
  </g>
  <g>
    <path d="M525 338 C610 250 690 250 775 338" fill="none" stroke="#2563eb" stroke-width="10" stroke-linecap="round"/>
    <path d="M755 310 L790 338 L755 366" fill="none" stroke="#2563eb" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="573" y="300" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" fill="#102033">Retrieve</text>
    <text x="552" y="390" font-family="Inter, Arial, sans-serif" font-size="18" fill="#64748b">only the useful shelf</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="805" y="132" width="312" height="412" rx="28" fill="#111827"/>
    <circle cx="960" cy="252" r="76" fill="#2563eb"/>
    <circle cx="936" cy="235" r="13" fill="#ffffff"/>
    <circle cx="984" cy="235" r="13" fill="#ffffff"/>
    <path d="M916 286 C944 313 977 313 1004 286" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round"/>
    <text x="882" y="378" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="900" fill="#ffffff">AI Agent</text>
    <text x="871" y="421" font-family="Inter, Arial, sans-serif" font-size="19" fill="#cbd5e1">asks, searches, reasons</text>
    <rect x="877" y="460" width="166" height="42" rx="21" fill="#10b981"/>
    <text x="916" y="488" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#ffffff">Proposal</text>
  </g>
