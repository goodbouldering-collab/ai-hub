<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Business-specific RAG flow</title>
  <desc id="desc">Different businesses require different RAG inspection orders.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f6f9fc"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <text x="88" y="108" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="900" fill="#102033">One RAG design does not fit all</text>
  <g filter="url(#shadow)">
    <rect x="92" y="176" width="470" height="400" rx="26" fill="#ffffff" stroke="#d8e2ee" stroke-width="3"/>
    <text x="132" y="234" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="900" fill="#1d4ed8">EC</text>
    <text x="132" y="274" font-family="Inter, Arial, sans-serif" font-size="19" fill="#64748b">sell, protect margin, avoid stock mistakes</text>
    <path d="M166 332 H486" stroke="#d8e2ee" stroke-width="3"/>
    <text x="166" y="371" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800" fill="#102033">Sales -> Margin -> Stock</text>
    <text x="166" y="421" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800" fill="#102033">Reviews -> SEO -> Action</text>
    <rect x="166" y="478" width="248" height="50" rx="25" fill="#eff6ff"/>
    <text x="203" y="511" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="800" fill="#1d4ed8">Push this product</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="638" y="176" width="470" height="400" rx="26" fill="#ffffff" stroke="#d8e2ee" stroke-width="3"/>
    <text x="678" y="234" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="900" fill="#047857">Event</text>
    <text x="678" y="274" font-family="Inter, Arial, sans-serif" font-size="19" fill="#64748b">connect people by intent and timing</text>
    <path d="M712 332 H1032" stroke="#d8e2ee" stroke-width="3"/>
    <text x="712" y="371" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800" fill="#102033">People -> Industry -> Issue</text>
    <text x="712" y="421" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800" fill="#102033">Need -> Referral -> Follow-up</text>
    <rect x="712" y="478" width="258" height="50" rx="25" fill="#ecfdf5"/>
    <text x="750" y="511" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="800" fill="#047857">Make an intro</text>
  </g>
</svg>
