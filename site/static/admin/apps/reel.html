<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>リール App Server | AI相談 管理</title>
  <style>
    :root { color-scheme: light; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif; }
    * { box-sizing:border-box; }
    html, body { width:100%; height:100%; margin:0; overflow:hidden; background:#f3f7f8; color:#071426; }
    body { display:grid; grid-template-rows:auto minmax(0,1fr); }
    header { min-height:64px; display:flex; align-items:center; justify-content:space-between; gap:16px; padding:10px 18px; border-bottom:1px solid rgba(7,20,38,.14); background:#fff; box-shadow:0 8px 24px rgba(7,20,38,.08); z-index:2; }
    .title { min-width:0; display:flex; align-items:center; gap:12px; }
    .mark { width:40px; height:40px; display:grid; place-items:center; border-radius:9px; background:linear-gradient(135deg,#7c3aed,#db2777); color:#fff; font-weight:900; }
    h1 { margin:0; font-size:17px; line-height:1.25; }
    p { margin:3px 0 0; color:#5a6878; font-size:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    nav { display:flex; gap:8px; flex:0 0 auto; }
    a { min-height:40px; display:inline-flex; align-items:center; justify-content:center; padding:0 13px; border:1px solid rgba(7,20,38,.16); border-radius:8px; background:#fff; color:#122033; text-decoration:none; font-size:12px; font-weight:850; }
    a.primary { border-color:#7c3aed; background:#7c3aed; color:#fff; }
    iframe { width:100%; height:100%; border:0; background:#fff; }
    @media (max-width:700px) { header { padding:8px 10px; } .mark { width:36px; height:36px; } h1 { font-size:14px; } p { display:none; } a { min-height:36px; padding:0 9px; font-size:11px; } }
  </style>
</head>
<body>
  <header>
    <div class="title">
      <span class="mark" aria-hidden="true">R</span>
      <div><h1>リール App Server</h1><p>企画・素材承認・9:16動画・投稿前プレビュー</p></div>
    </div>
    <nav aria-label="リール App Server 操作">
      <a href="/admin">管理へ戻る</a>
      <a class="primary" href="https://business-content-app-server.vercel.app/reel?business=ai-hub" target="_blank" rel="noopener">個別に開く</a>
    </nav>
  </header>
  <iframe title="リール App Server" src="https://business-content-app-server.vercel.app/reel?business=ai-hub" allow="clipboard-read; clipboard-write; fullscreen"></iframe>
</body>
</html>
