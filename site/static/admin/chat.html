<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIハブ 管理画面 — 社内エージェントに質問</title>
<meta name="robots" content="noindex,nofollow">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg-base:#f8fafc; --bg-white:#ffffff;
    --text:#0f172a; --text-soft:#334155; --muted:#64748b;
    --line:#e2e8f0; --primary:#2563eb; --primary-bg:#eff6ff;
    --err:#ef4444;
    --shadow-card: 0 12px 40px rgba(15,23,42,0.08);
  }
  body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Hiragino Sans','Noto Sans JP',sans-serif;
    background:linear-gradient(180deg,#ffffff 0%,#f8fafc 100%);
    color:var(--text); min-height:100vh; padding:24px; line-height:1.6; }
  ::selection { background: var(--primary); color: #fff; }
  .container { max-width:960px; margin:0 auto; }
  .topbar {
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap;
    gap:14px; margin-bottom:18px;
  }
  .topbar h1 {
    font-size:22px; font-weight:800; letter-spacing:-.01em; color:var(--text);
    display:inline-flex; align-items:center; gap:10px;
  }
  .topbar h1 .dot { width:10px; height:10px; border-radius:999px; background:var(--primary); }
  .topbar-actions { display:flex; gap:8px; flex-wrap:wrap; }
  .topbar-actions a {
    display:inline-flex; align-items:center; gap:6px;
    padding:8px 14px; border-radius:999px;
    background:#fff; border:1px solid var(--line);
    font-size:12.5px; font-weight:700; color:var(--text-soft);
    text-decoration:none; box-shadow:0 4px 12px rgba(15,23,42,.05);
    transition:transform .2s, background .2s, color .2s;
  }
  .topbar-actions a:hover { background:var(--primary-bg); color:var(--primary); transform:translateY(-1px); }
  .sub { color:var(--muted); font-size:13px; margin-bottom:16px; }
  .sub a { color:var(--primary); font-weight:700; text-decoration:none; }
  .sub a:hover { text-decoration: underline; }
  .chat-log {
    background:#fff; border:1px solid var(--line);
    border-radius:18px; padding:18px;
    min-height:360px; max-height:62vh; overflow-y:auto;
    display:flex; flex-direction:column; gap:10px;
    box-shadow: var(--shadow-card);
  }
  .msg { max-width: 88%; padding:12px 16px; border-radius:16px; font-size:13.5px; line-height:1.7; }
  .msg.user      { align-self:flex-end;   background: var(--primary); color:#fff; }
  .msg.user a    { color:#fff; text-decoration:underline; }
  .msg.assistant { align-self:flex-start; background: var(--primary-bg); color:var(--text); border:1px solid rgba(37,99,235,.18); }
  .msg.system    { align-self:center; color:var(--muted); font-size:11.5px; padding:4px 10px; background:transparent; }
  .msg pre { background: rgba(15,23,42,.06); padding:8px 10px; border-radius:8px;
    overflow-x:auto; font-size:12px; margin:6px 0; color:var(--text); }
  .msg.user pre { background: rgba(255,255,255,.18); color: #fff; }
  .msg code { background: rgba(15,23,42,.08); padding:1px 5px; border-radius:4px; font-size:12px; }
  .msg.user code { background: rgba(255,255,255,.18); color: #fff; }
  .msg a { color: var(--primary); }
  .typing { color: var(--muted); font-style: italic; }

  .composer {
    margin-top:14px;
    background:#fff; border:1px solid var(--line);
    border-radius:18px; padding:12px;
    display:flex; gap:10px; align-items:flex-end;
    box-shadow: var(--shadow-card);
  }
  .composer textarea {
    flex:1 1 auto;
    background:#f8fafc; border:1px solid var(--line); color:var(--text);
    font:inherit; font-size:14px;
    padding:12px 14px; border-radius:12px;
    min-height: 50px; max-height:200px; resize:vertical;
    transition: border-color .2s, box-shadow .2s;
  }
  .composer textarea:focus { outline:none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,.15); }
  .composer button {
    padding:12px 24px; border-radius:999px; border:none;
    background: var(--primary);
    color:#fff; font:inherit; font-size:14px; font-weight:700; cursor:pointer;
    white-space:nowrap;
    box-shadow: 0 8px 20px rgba(37,99,235,.30);
    transition: transform .2s, box-shadow .2s, background .2s;
  }
  .composer button:hover:not(:disabled) { background:#1d4fd6; transform:translateY(-1px); box-shadow: 0 12px 26px rgba(37,99,235,.40); }
  .composer button:disabled { opacity:.5; cursor:not-allowed; transform:none; box-shadow:none; }
  .hint { color:var(--muted); font-size:11.5px; margin-top:8px; }
  .examples { display:flex; flex-wrap:wrap; gap:6px; margin: 4px 0 16px 0; }
  .examples button {
    font-size:11.5px; padding:7px 14px; border-radius:999px;
    background: #fff; color: var(--text-soft);
    border:1px solid var(--line); cursor:pointer; font-weight:600;
    transition: all .2s;
  }
  .examples button:hover { background: var(--primary-bg); color: var(--primary); border-color: rgba(37,99,235,.30); }
</style>
</head>
<body>
<div class="container">
  <div class="topbar">
    <div>
      <h1><span class="dot"></span>🤖 社内エージェントに質問</h1>
      <p class="sub">
        consul/work と各事業の CLAUDE.md を参照して回答します。
      </p>
    </div>
    <div class="topbar-actions">
      <a href="/">🌐 公開トップ</a>
      <a href="/admin">🛠 管理画面</a>
      <a href="/admin/docs">📚 ドキュメント</a>
    </div>
  </div>

  <div class="examples" id="examples">
    <button data-example="グッぼるのブログ投稿はどの手順で出す？">グッぼるのブログ投稿の手順</button>
    <button data-example="ビジネス21の SEO 戦略の要点をまとめて">ビジネス21 SEO 要点</button>
    <button data-example="Notエステで今進んでいるタスクは何？">Notエステの進行タスク</button>
    <button data-example="Vercel と Cloudflare の使い分けルールを教えて">Vercel/Cloudflare の使い分け</button>
    <button data-example="cron ジョブの全体一覧を出して">cron 全体一覧</button>
  </div>

  <div class="chat-log" id="chat-log">
    <div class="msg system">最近の consul/work（過去30日）と事業ドキュメントから根拠ベースで答えます。質問をどうぞ。</div>
  </div>

  <div class="composer">
    <textarea id="input" placeholder="9 事業のこと・社内資料のことを質問…（Enter で送信 / Shift+Enter で改行）"></textarea>
    <button id="send">送信</button>
  </div>
  <p class="hint">※ Claude 4.7 と consul/work の最新 grep ベース RAG。回答は根拠引用付き。長文質問は約 6000 文字まで。</p>
</div>

<script>
const $ = (id) => document.getElementById(id);
const log = $("chat-log");
const inputEl = $("input");
const sendBtn = $("send");

let history = []; // {role, content}

function escapeHtml(s) {
  return String(s||"").replace(/[&<>"']/g, m => (
    {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]
  ));
}

// 極めて簡素な Markdown レンダラ（コードブロック / インラインコード / 太字 / リンクのみ）
function renderMarkdown(s) {
  let h = escapeHtml(s);
  // コードブロック
  h = h.replace(/```([\s\S]*?)```/g, (_, code) => `<pre>${code}</pre>`);
  // インラインコード
  h = h.replace(/`([^`]+)`/g, "<code>$1</code>");
  // 太字
  h = h.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  // リンク [text](url)
  h = h.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_, t, u) => `<a href="${u}" target="_blank" rel="noopener">${t}</a>`);
  // 改行
  h = h.replace(/\n/g, "<br>");
  return h;
}

function addMsg(role, content) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.innerHTML = role === "assistant" ? renderMarkdown(content) : escapeHtml(content);
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
  return div;
}

async function send() {
  const text = inputEl.value.trim();
  if (!text || sendBtn.disabled) return;
  inputEl.value = "";
  addMsg("user", text);
  history.push({ role: "user", content: text });
  sendBtn.disabled = true;
  const typing = addMsg("assistant", "");
  typing.classList.add("typing");
  typing.textContent = "考え中…";
  try {
    const res = await fetch("/api/admin/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ history }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      typing.classList.remove("typing");
      typing.innerHTML = `<span style="color:var(--err);">エラー: ${escapeHtml(data?.error || res.statusText)}</span>`;
      return;
    }
    typing.classList.remove("typing");
    typing.innerHTML = renderMarkdown(data.reply || "(空応答)");
    history.push({ role: "assistant", content: data.reply || "" });
  } catch (e) {
    typing.classList.remove("typing");
    typing.innerHTML = `<span style="color:var(--err);">通信失敗: ${escapeHtml(e.message)}</span>`;
  } finally {
    sendBtn.disabled = false;
    inputEl.focus();
  }
}

sendBtn.addEventListener("click", send);
inputEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});
document.querySelectorAll("#examples button[data-example]").forEach(b => {
  b.addEventListener("click", () => {
    inputEl.value = b.dataset.example;
    inputEl.focus();
  });
});
inputEl.focus();
</script>
</body>
</html>
