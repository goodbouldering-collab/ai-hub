<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI相談。彦根</title>
<meta name="robots" content="noindex,nofollow">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg-base:#f8fafc; --bg-white:#ffffff;
    --text:#0f172a; --text-soft:#334155; --muted:#64748b;
    --line:#e2e8f0; --primary:#2563eb; --primary-bg:#eff6ff;
    --err:#ef4444;
    --shadow-card: 0 12px 40px rgba(15,23,42,0.08);
  }
  body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Hiragino Sans','Noto Sans JP',sans-serif;
    background:linear-gradient(180deg,#ffffff 0%,#f8fafc 100%);
    color:var(--text); min-height:100vh; padding:24px; line-height:1.6; }
  ::selection { background: var(--primary); color: #fff; }
  .container { max-width:960px; margin:0 auto; padding-top:124px; }
  /* PORTAL(build_portal.py)と同一の site-header に統一。中身は管理用動線。 */
  header.site-header {
    position:fixed; inset:0 0 auto 0; z-index:50;
    transition:background .3s, box-shadow .3s, backdrop-filter .3s;
  }
  header.site-header.scrolled {
    background:rgba(255,255,255,0.92);
    box-shadow:0 1px 0 rgba(15,23,42,0.05), 0 10px 30px rgba(15,23,42,0.04);
    backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
  }
  .site-header-inner {
    max-width:1280px; margin:0 auto; padding:14px 24px;
    display:flex; align-items:center; justify-content:space-between; gap:16px;
  }
  .site-logo {
    font-size:18px; font-weight:800; letter-spacing:-.01em;
    color:var(--text); text-decoration:none;
    display:inline-flex; align-items:center; gap:8px;
  }
  .site-logo .dot { width:8px; height:8px; border-radius:999px; background:var(--primary); display:inline-block; }
  .brand-mark {
    width:44px; height:36px; border-radius:8px;
    display:inline-flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg,#ffffff 0%,#eaf8ff 58%,#eafbf7 100%);
    border:1px solid rgba(0,95,158,.18);
    box-shadow:0 10px 24px rgba(0,95,158,.12), inset 0 1px 0 rgba(255,255,255,.95);
    color:#0f172a; font-size:14px; font-weight:900; letter-spacing:0;
  }
  .brand-mark .brand-ha { color:var(--primary); margin-left:1px; }
  .wordmark { display:inline-flex; align-items:baseline; gap:3px; font-weight:900; letter-spacing:0; }
  .wordmark .word-ai { color:var(--primary); }
  .wordmark .word-hub { color:var(--text); }
  .wordmark .word-en { margin-left:8px; color:var(--muted); font-size:11px; font-weight:700; letter-spacing:.08em; }
  .site-logo-by { color:var(--muted); font-weight:600; font-size:12px; margin-left:4px; white-space:nowrap; }
  .site-nav { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .site-nav a.nav-link {
    padding:8px 10px; border-radius:8px; border:1px solid #e2e8f0;
    background:#fff; font-size:13px; font-weight:750; color:#1e293b;
    text-decoration:none; transition:color .2s, background .2s, border-color .2s;
  }
  .site-nav a.nav-link:hover { color:#1d4ed8; background:#eff6ff; border-color:#bfdbfe; }
  .site-nav .login-btn {
    display:inline-flex; align-items:center; gap:6px;
    padding:9px 16px; border-radius:8px;
    background:var(--text); color:#fff;
    font-size:13px; font-weight:700;
    text-decoration:none; transition:background .2s, transform .2s;
  }
  .site-nav .login-btn:hover { background:var(--primary); transform:translateY(-1px); }
  .admin-subnav {
    max-width:1280px; margin:0 auto; padding:0 24px 12px;
    display:flex; align-items:center; gap:8px; overflow-x:auto;
  }
  .admin-subnav a {
    flex:0 0 auto; min-height:34px; display:inline-flex; align-items:center;
    padding:0 12px; border-radius:8px; border:1px solid #d8e2ee;
    background:rgba(255,255,255,.82); color:#1e293b;
    font-size:12.5px; font-weight:800; text-decoration:none;
  }
  .admin-subnav a:hover { color:#1d4ed8; background:#eff6ff; border-color:#bfdbfe; }
  .topbar { margin-bottom:18px; }
  .topbar h1 {
    font-size:22px; font-weight:800; letter-spacing:-.01em; color:var(--text);
    display:inline-flex; align-items:center; gap:10px;
  }
  .topbar h1 .dot { width:10px; height:10px; border-radius:999px; background:var(--primary); }
  .sub { color:var(--muted); font-size:13px; margin-bottom:16px; }
  .sub a { color:var(--primary); font-weight:700; text-decoration:none; }
  .sub a:hover { text-decoration: underline; }
  .chat-log {
    background:#fff; border:1px solid var(--line);
    border-radius:18px; padding:18px;
    min-height:360px; max-height:62vh; overflow-y:auto;
    display:flex; flex-direction:column; gap:10px;
    box-shadow: var(--shadow-card);
  }
  .msg { max-width: 88%; padding:12px 16px; border-radius:16px; font-size:13.5px; line-height:1.7; }
  .msg.user      { align-self:flex-end;   background: var(--primary); color:#fff; }
  .msg.user a    { color:#fff; text-decoration:underline; }
  .msg.assistant { align-self:flex-start; background: var(--primary-bg); color:var(--text); border:1px solid rgba(37,99,235,.18); }
  .msg.system    { align-self:center; color:var(--muted); font-size:11.5px; padding:4px 10px; background:transparent; }
  .msg pre { background: rgba(15,23,42,.06); padding:8px 10px; border-radius:8px;
    overflow-x:auto; font-size:12px; margin:6px 0; color:var(--text); }
  .msg.user pre { background: rgba(255,255,255,.18); color: #fff; }
  .msg code { background: rgba(15,23,42,.08); padding:1px 5px; border-radius:4px; font-size:12px; }
  .msg.user code { background: rgba(255,255,255,.18); color: #fff; }
  .msg a { color: var(--primary); }
  .typing { color: var(--muted); font-style: italic; }

  .composer {
    margin-top:14px;
    background:#fff; border:1px solid var(--line);
    border-radius:18px; padding:12px;
    display:flex; gap:10px; align-items:flex-end;
    box-shadow: var(--shadow-card);
  }
  .composer textarea {
    flex:1 1 auto;
    background:#f8fafc; border:1px solid var(--line); color:var(--text);
    font:inherit; font-size:14px;
    padding:12px 14px; border-radius:12px;
    min-height: 50px; max-height:200px; resize:vertical;
    transition: border-color .2s, box-shadow .2s;
  }
  .composer textarea:focus { outline:none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,.15); }
  .composer button {
    padding:12px 24px; border-radius:999px; border:none;
    background: var(--primary);
    color:#fff; font:inherit; font-size:14px; font-weight:700; cursor:pointer;
    white-space:nowrap;
    box-shadow: 0 8px 20px rgba(37,99,235,.30);
    transition: transform .2s, box-shadow .2s, background .2s;
  }
  .composer button:hover:not(:disabled) { background:#1d4fd6; transform:translateY(-1px); box-shadow: 0 12px 26px rgba(37,99,235,.40); }
  .composer button:disabled { opacity:.5; cursor:not-allowed; transform:none; box-shadow:none; }
  .hint { color:var(--muted); font-size:11.5px; margin-top:8px; }
  .examples { display:flex; flex-wrap:wrap; gap:6px; margin: 4px 0 16px 0; }
  .examples button {
    font-size:11.5px; padding:7px 14px; border-radius:999px;
    background: #fff; color: var(--text-soft);
    border:1px solid var(--line); cursor:pointer; font-weight:600;
    transition: all .2s;
  }
  .examples button:hover { background: var(--primary-bg); color: var(--primary); border-color: rgba(37,99,235,.30); }
  @media (max-width:900px) {
    .container { padding-top:190px; }
    .site-header-inner { align-items:flex-start; flex-direction:column; }
    .site-nav { gap:12px; }
    .wordmark .word-en, .site-logo-by { display:none; }
    .admin-subnav { padding:0 24px 14px; }
  }
</style>
<link rel="stylesheet" href="/admin/admin-common.css">
</head>
<body class="admin-page admin-theme-light">
<header class="site-header scrolled" id="site-header">
  <div class="site-header-inner">
    <a class="site-logo" href="/" aria-label="AI相談。彦根 公開ページへ">
      <span class="brand-mark" aria-hidden="true"><span class="brand-a">AI</span><span class="brand-ha">相</span></span>
      <span class="wordmark"><span class="word-ai">AI相談</span><span class="word-hub">彦根</span><span class="word-en">AI CONSULT</span></span>
      <span class="site-logo-by">管理画面</span>
    </a>
    <nav class="site-nav" aria-label="公開ページナビ">
      <a class="nav-link" href="/#packages">受講プラン</a>
      <a class="nav-link" href="/#speaker">講師紹介</a>
      <a class="nav-link" href="/#lectures">講習資料</a>
      <a class="nav-link" href="/watch/index.html">AI Watch</a>
      <a class="login-btn" href="/">公開ページへ戻る</a>
    </nav>
  </div>
  <nav class="admin-subnav" aria-label="管理メニュー">
    <a href="/admin#admin-menu">管理ハブ</a>
    <a href="/admin#panel-status">記事生成</a>
    <a href="/admin/gubble-sns">SNS分析</a>
    <a href="/admin/sns-post">SNS投稿</a>
    <a href="/admin/chat">社内AI</a>
    <a href="/ops">OPS</a>
  </nav>
</header>
<div class="container">
  <div class="topbar">
    <div>
      <h1><span class="dot"></span>🤖 社内エージェントに質問</h1>
      <p class="sub">
        consul/work と各事業の CLAUDE.md を参照して回答します。
      </p>
    </div>
  </div>

  <div class="examples" id="examples">
    <button data-example="グッぼるのブログ投稿はどの手順で出す？">グッぼるのブログ投稿の手順</button>
    <button data-example="ビジネス21の SEO 戦略の要点をまとめて">ビジネス21 SEO 要点</button>
    <button data-example="Notエステで今進んでいるタスクは何？">Notエステの進行タスク</button>
    <button data-example="Vercel と Cloudflare の使い分けルールを教えて">Vercel/Cloudflare の使い分け</button>
    <button data-example="cron ジョブの全体一覧を出して">cron 全体一覧</button>
  </div>

  <div class="chat-log" id="chat-log">
    <div class="msg system">最近の consul/work（過去30日）と事業ドキュメントから根拠ベースで答えます。質問をどうぞ。</div>
  </div>

  <div class="composer">
    <textarea id="input" placeholder="9 事業のこと・社内資料のことを質問…（Enter で送信 / Shift+Enter で改行）"></textarea>
    <button id="send">送信</button>
  </div>
  <p class="hint">※ Claude 4.7 と consul/work の最新 grep ベース RAG。回答は根拠引用付き。長文質問は約 6000 文字まで。</p>
</div>

<script>
const $ = (id) => document.getElementById(id);
const log = $("chat-log");
const inputEl = $("input");
const sendBtn = $("send");

let history = []; // {role, content}

function escapeHtml(s) {
  return String(s||"").replace(/[&<>"']/g, m => (
    {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]
  ));
}

// 極めて簡素な Markdown レンダラ（コードブロック / インラインコード / 太字 / リンクのみ）
function renderMarkdown(s) {
  let h = escapeHtml(s);
  // コードブロック
  h = h.replace(/```([\s\S]*?)```/g, (_, code) => `<pre>${code}</pre>`);
  // インラインコード
  h = h.replace(/`([^`]+)`/g, "<code>$1</code>");
  // 太字
  h = h.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  // リンク [text](url)
  h = h.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_, t, u) => `<a href="${u}" target="_blank" rel="noopener">${t}</a>`);
  // 改行
  h = h.replace(/\n/g, "<br>");
  return h;
}

function addMsg(role, content) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.innerHTML = role === "assistant" ? renderMarkdown(content) : escapeHtml(content);
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
  return div;
}

async function send() {
  const text = inputEl.value.trim();
  if (!text || sendBtn.disabled) return;
  inputEl.value = "";
  addMsg("user", text);
  history.push({ role: "user", content: text });
  sendBtn.disabled = true;
  const typing = addMsg("assistant", "");
  typing.classList.add("typing");
  typing.textContent = "考え中…";
  try {
    const res = await fetch("/api/admin/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ history }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      typing.classList.remove("typing");
      typing.innerHTML = `<span style="color:var(--err);">エラー: ${escapeHtml(data?.error || res.statusText)}</span>`;
      return;
    }
    typing.classList.remove("typing");
    typing.innerHTML = renderMarkdown(data.reply || "(空応答)");
    history.push({ role: "assistant", content: data.reply || "" });
  } catch (e) {
    typing.classList.remove("typing");
    typing.innerHTML = `<span style="color:var(--err);">通信失敗: ${escapeHtml(e.message)}</span>`;
  } finally {
    sendBtn.disabled = false;
    inputEl.focus();
  }
}

sendBtn.addEventListener("click", send);
inputEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});
document.querySelectorAll("#examples button[data-example]").forEach(b => {
  b.addEventListener("click", () => {
    inputEl.value = b.dataset.example;
    inputEl.focus();
  });
});
inputEl.focus();
</script>
</body>
</html>
