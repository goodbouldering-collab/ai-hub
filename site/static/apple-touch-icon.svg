<svg viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1126"/>
      <stop offset="1" stop-color="#1a1d3a"/>
    </linearGradient>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7aa2ff"/>
      <stop offset="0.5" stop-color="#c77dff"/>
      <stop offset="1" stop-color="#ff7ab6"/>
    </linearGradient>
    <radialGradient id="hub" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="0.5" stop-color="#c77dff"/>
      <stop offset="1" stop-color="#7aa2ff"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="180" height="180" rx="36" fill="url(#bg)"/>

  <!-- 装飾の薄い同心リング -->
  <g fill="none" stroke="url(#grad)" opacity="0.18">
    <circle cx="90" cy="90" r="60" stroke-width="1.5"/>
    <circle cx="90" cy="90" r="42" stroke-width="1.5"/>
  </g>

  <!-- 6本のスポーク -->
  <g stroke="url(#grad)" stroke-width="6.5" stroke-linecap="round">
    <line x1="90" y1="90" x2="90" y2="35"/>
    <line x1="90" y1="90" x2="138" y2="62"/>
    <line x1="90" y1="90" x2="138" y2="118"/>
    <line x1="90" y1="90" x2="90" y2="145"/>
    <line x1="90" y1="90" x2="42" y2="118"/>
    <line x1="90" y1="90" x2="42" y2="62"/>
  </g>

  <!-- 外周ノード -->
  <g filter="url(#glow)">
    <circle cx="90" cy="35" r="9" fill="#7aa2ff"/>
    <circle cx="138" cy="62" r="9" fill="#c77dff"/>
    <circle cx="138" cy="118" r="9" fill="#ff7ab6"/>
    <circle cx="90" cy="145" r="9" fill="#ff7ab6"/>
    <circle cx="42" cy="118" r="9" fill="#c77dff"/>
    <circle cx="42" cy="62" r="9" fill="#7aa2ff"/>
  </g>

  <!-- 中央ハブ -->
  <circle cx="90" cy="90" r="20" fill="url(#hub)" filter="url(#glow)"/>
  <circle cx="90" cy="90" r="7.5" fill="#fff"/>

  <!-- 下部に小さく "AI HUB" -->
  <text x="90" y="173" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="9" font-weight="800" letter-spacing="2.5" fill="#aab1c5" opacity="0.7">AI HUB</text>
</svg>
