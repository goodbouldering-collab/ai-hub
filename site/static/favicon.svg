<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="aihBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2150"/>
      <stop offset="0.5" stop-color="#0d1126"/>
      <stop offset="1" stop-color="#1a0e2e"/>
    </linearGradient>
    <linearGradient id="aihSpoke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7aa2ff"/>
      <stop offset="0.5" stop-color="#c77dff"/>
      <stop offset="1" stop-color="#ff7ab6"/>
    </linearGradient>
    <radialGradient id="aihHub" cx="0.5" cy="0.4" r="0.65">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.4" stop-color="#dceaff"/>
      <stop offset="0.85" stop-color="#7aa2ff"/>
      <stop offset="1" stop-color="#5b6fd8"/>
    </radialGradient>
    <radialGradient id="aihHalo" cx="0.5" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#7aa2ff" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#c77dff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#0d1126" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 背景: 角丸タイル + 中心ハロー -->
  <rect x="0" y="0" width="64" height="64" rx="16" fill="url(#aihBg)"/>
  <circle cx="32" cy="32" r="26" fill="url(#aihHalo)"/>

  <!-- 8本スポーク（45度ずつ） -->
  <g stroke="url(#aihSpoke)" stroke-width="2.6" stroke-linecap="round" opacity="0.95">
    <line x1="32" y1="32" x2="32" y2="11"/>
    <line x1="32" y1="32" x2="46.85" y2="17.15"/>
    <line x1="32" y1="32" x2="53" y2="32"/>
    <line x1="32" y1="32" x2="46.85" y2="46.85"/>
    <line x1="32" y1="32" x2="32" y2="53"/>
    <line x1="32" y1="32" x2="17.15" y2="46.85"/>
    <line x1="32" y1="32" x2="11" y2="32"/>
    <line x1="32" y1="32" x2="17.15" y2="17.15"/>
  </g>

  <!-- 外周ノード（8点・小）-->
  <g fill="#e8ebf5">
    <circle cx="32" cy="11" r="2.4"/>
    <circle cx="46.85" cy="17.15" r="2.4"/>
    <circle cx="53" cy="32" r="2.4"/>
    <circle cx="46.85" cy="46.85" r="2.4"/>
    <circle cx="32" cy="53" r="2.4"/>
    <circle cx="17.15" cy="46.85" r="2.4"/>
    <circle cx="11" cy="32" r="2.4"/>
    <circle cx="17.15" cy="17.15" r="2.4"/>
  </g>

  <!-- 中央ハブ（球体感）-->
  <circle cx="32" cy="32" r="9.5" fill="url(#aihHub)"/>
  <circle cx="29.6" cy="29.6" r="2.4" fill="#ffffff" opacity="0.85"/>
</svg>
