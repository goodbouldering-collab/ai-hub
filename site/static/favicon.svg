<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1126"/>
      <stop offset="1" stop-color="#1a1d3a"/>
    </linearGradient>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7aa2ff"/>
      <stop offset="0.5" stop-color="#c77dff"/>
      <stop offset="1" stop-color="#ff7ab6"/>
    </linearGradient>
    <radialGradient id="hub" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="0.5" stop-color="#c77dff"/>
      <stop offset="1" stop-color="#7aa2ff"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 角丸の背景タイル -->
  <rect x="0" y="0" width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- 6 本のスポーク（ハブから外へ） -->
  <g stroke="url(#grad)" stroke-width="2.4" stroke-linecap="round" opacity="0.95">
    <line x1="32" y1="32" x2="32" y2="13"/>
    <line x1="32" y1="32" x2="48.5" y2="22.5"/>
    <line x1="32" y1="32" x2="48.5" y2="41.5"/>
    <line x1="32" y1="32" x2="32" y2="51"/>
    <line x1="32" y1="32" x2="15.5" y2="41.5"/>
    <line x1="32" y1="32" x2="15.5" y2="22.5"/>
  </g>

  <!-- 外周ノード（6点） -->
  <g fill="#7aa2ff" filter="url(#glow)">
    <circle cx="32" cy="13" r="3.2"/>
    <circle cx="48.5" cy="22.5" r="3.2" fill="#c77dff"/>
    <circle cx="48.5" cy="41.5" r="3.2" fill="#ff7ab6"/>
    <circle cx="32" cy="51" r="3.2" fill="#ff7ab6"/>
    <circle cx="15.5" cy="41.5" r="3.2" fill="#c77dff"/>
    <circle cx="15.5" cy="22.5" r="3.2"/>
  </g>

  <!-- 中央ハブ -->
  <circle cx="32" cy="32" r="7.2" fill="url(#hub)" filter="url(#glow)"/>
  <circle cx="32" cy="32" r="2.6" fill="#fff"/>
</svg>
