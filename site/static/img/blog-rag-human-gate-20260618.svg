<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">RAG design checklist</title>
  <desc id="desc">Five steps for designing RAG with automation and human review boundaries.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <text x="86" y="105" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="900" fill="#102033">Start with a small, reviewable design</text>
  <g transform="translate(80 190)" filter="url(#shadow)">
    <rect width="196" height="310" rx="24" fill="#ffffff" stroke="#d8e2ee" stroke-width="3"/>
    <circle cx="54" cy="58" r="24" fill="#2563eb"/>
    <text x="46" y="67" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="900" fill="#ffffff">1</text>
    <text x="36" y="132" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="900" fill="#102033">Break down</text>
    <text x="36" y="170" font-family="Inter, Arial, sans-serif" font-size="18" fill="#64748b">the work</text>
  </g>
  <g transform="translate(302 190)" filter="url(#shadow)">
    <rect width="196" height="310" rx="24" fill="#ffffff" stroke="#d8e2ee" stroke-width="3"/>
    <circle cx="54" cy="58" r="24" fill="#10b981"/>
    <text x="46" y="67" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="900" fill="#ffffff">2</text>
    <text x="36" y="132" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="900" fill="#102033">Organize</text>
    <text x="36" y="170" font-family="Inter, Arial, sans-serif" font-size="18" fill="#64748b">sources</text>
  </g>
  <g transform="translate(524 190)" filter="url(#shadow)">
    <rect width="196" height="310" rx="24" fill="#ffffff" stroke="#d8e2ee" stroke-width="3"/>
    <circle cx="54" cy="58" r="24" fill="#f97316"/>
    <text x="46" y="67" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="900" fill="#ffffff">3</text>
    <text x="36" y="132" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="900" fill="#102033">Decide</text>
    <text x="36" y="170" font-family="Inter, Arial, sans-serif" font-size="18" fill="#64748b">the order</text>
  </g>
  <g transform="translate(746 190)" filter="url(#shadow)">
    <rect width="196" height="310" rx="24" fill="#ffffff" stroke="#d8e2ee" stroke-width="3"/>
    <circle cx="54" cy="58" r="24" fill="#7c3aed"/>
    <text x="46" y="67" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="900" fill="#ffffff">4</text>
    <text x="36" y="132" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="900" fill="#102033">Automate</text>
    <text x="36" y="170" font-family="Inter, Arial, sans-serif" font-size="18" fill="#64748b">small loops</text>
  </g>
  <g transform="translate(968 190)" filter="url(#shadow)">
    <rect width="196" height="310" rx="24" fill="#111827"/>
    <circle cx="54" cy="58" r="24" fill="#ffffff"/>
    <text x="46" y="67" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="900" fill="#111827">5</text>
    <text x="36" y="132" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="900" fill="#ffffff">Human</text>
    <text x="36" y="170" font-family="Inter, Arial, sans-serif" font-size="18" fill="#cbd5e1">review gate</text>
  </g>
  <rect x="344" y="558" width="512" height="54" rx="27" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="398" y="593" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="900" fill="#1d4ed8">Small flow first, reliable automation later</text>
</svg>
