<!-- diagnosis-popups:start -->
<style>
.home-diagnosis-dialog {
  box-sizing: border-box;
  width: min(720px, calc(100% - 24px));
  max-width: 100%;
  padding: 0;
  border: 1px solid #bfd3cc;
  border-radius: 20px;
  color: #183c3e;
  background: #fffefa;
}
.home-diagnosis-dialog:modal {
  width: min(460px, calc(100% - 40px));
  max-height: calc(100dvh - 40px);
  padding: 28px 26px 16px;
  border-color: var(--line);
  border-radius: var(--radius-sm);
  color: var(--text);
  background: var(--bg-white);
  box-shadow: 0 30px 80px rgb(0 0 0 / 40%);
}
.home-diagnosis-dialog::backdrop {
  background: rgb(15 23 42 / 55%);
  backdrop-filter: blur(6px);
}
.home-diagnosis-dialog:modal .home-diagnosis-dialog__bar {
  padding: 0 38px 0 0;
  border: 0;
  font-size: 18px;
  font-weight: 800;
}
.home-diagnosis-dialog:modal .home-diagnosis-dialog__close {
  position: absolute;
  top: 7px;
  right: 9px;
  min-width: 44px;
  padding: 0;
  border: 0;
  background: none;
  color: var(--muted);
  font-size: 26px;
  line-height: 1;
}
.home-diagnosis-dialog:modal iframe {
  max-height: calc(100dvh - 160px);
}
.home-diagnosis-dialog:modal .home-diagnosis-dialog__fallback {
  padding: 6px 0 0;
  font-size: 12px;
}
@media (max-width: 600px) {
  .home-diagnosis-dialog:modal {
    width: calc(100% - 24px);
    padding: 16px 14px 10px;
  }
  .home-diagnosis-dialog:modal iframe {
    max-height: calc(100dvh - 112px);
  }
  body.studio-theme.studio-editorial.studio-home #faq details > summary {
    padding: 13px 14px !important;
  }
  body.studio-theme.studio-editorial.studio-home #faq details[open] > p {
    margin: 0 !important;
    padding: 0 14px 12px !important;
  }
}
.home-diagnosis-dialog:not([open]) { display: none; }
.home-diagnosis-dialog[open] { display: block; }
.home-diagnosis-dialog.is-result {
  position: static;
  flex-basis: 100%;
  width: 100%;
  max-height: none;
  margin: 16px 0 0;
}
.home-diagnosis-dialog__bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 16px;
  border-bottom: 1px solid #bfd3cc;
}
.home-diagnosis-dialog__bar button {
  min-height: 44px;
  padding: 6px 12px;
  color: #183c3e;
  background: #f0f6f2;
  border: 1px solid #bfd3cc;
  border-radius: 8px;
  white-space: nowrap;
  cursor: pointer;
}
.home-diagnosis-dialog iframe {
  display: block;
  width: 100%;
  height: min(620px, calc(100dvh - 110px));
  border: 0;
}
.home-diagnosis-dialog__fallback {
  display: block;
  padding: 10px 16px;
  color: #065f5b;
}
</style>
<script>
(() => {
  if (!window.HTMLDialogElement?.prototype.showModal) return;
  const group = document.getElementById('diagnosis-start');
  const tools = [
    { path: '/seo-llmo-diagnosis/', input: '.audit-start', result: '#audit-results', heading: '#audit-result-title' },
    { path: '/ai-agent-readiness/', input: '.diagnosis-start__heading, #assessment-form', result: '#result-panel', heading: '#result-heading' }
  ];
  for (const { path, input, result, heading } of tools) {
    const link = group.querySelector('a[href="' + path + '"]');
    if (!link) continue;
    const title = link.querySelector('strong').textContent;
    const dialog = document.createElement('dialog');
    dialog.className = 'home-diagnosis-dialog';
    dialog.setAttribute('aria-label', title);
    link.setAttribute('aria-haspopup', 'dialog');
    const bar = document.createElement('div');
    bar.className = 'home-diagnosis-dialog__bar';
    const label = document.createElement('strong');
    label.textContent = title;
    const close = document.createElement('button');
    close.type = 'button';
    close.className = 'home-diagnosis-dialog__close';
    close.setAttribute('aria-label', '閉じる');
    close.textContent = '閉じる';
    close.autofocus = true;
    const retry = document.createElement('button');
    retry.type = 'button';
    retry.textContent = '入力に戻る';
    retry.hidden = true;
    bar.append(label, retry, close);
    const frame = document.createElement('iframe');
    frame.title = title;
    frame.allow = 'clipboard-write';
    const fallback = document.createElement('a');
    fallback.className = 'home-diagnosis-dialog__fallback';
    fallback.href = path;
    fallback.textContent = '診断ページを開く';
    dialog.append(bar, frame, fallback);
    group.after(dialog);
    let resize;
    let changes;
    let ready = false;

    function openInput() {
      if (dialog.open) dialog.close();
      dialog.classList.remove('is-result');
      frame.style.height = '';
      label.textContent = title;
      close.textContent = '×';
      retry.hidden = true;
      dialog.showModal();
    }

    function showResult(doc, main) {
      const wasOpen = dialog.open;
      dialog.close();
      dialog.classList.add('is-result');
      label.textContent = title + 'の結果';
      close.textContent = '閉じる';
      retry.hidden = path !== '/seo-llmo-diagnosis/';
      if (!wasOpen) return;
      dialog.show();
      frame.style.height = main.scrollHeight + 'px';
      dialog.scrollIntoView({ block: 'start' });
      doc.querySelector(heading)?.focus({ preventScroll: true });
    }

    link.addEventListener('click', event => {
      if (event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
      event.preventDefault();
      if (dialog.classList.contains('is-result')) {
        if (!dialog.open) dialog.show();
        dialog.scrollIntoView({ block: 'start' });
        close.focus({ preventScroll: true });
        return;
      }
      if (!ready) frame.src = path;
      openInput();
    });
    close.addEventListener('click', () => {
      dialog.close();
      link.focus();
    });
    dialog.addEventListener('cancel', event => {
      event.preventDefault();
      dialog.close();
      link.focus();
    });
    frame.addEventListener('load', () => {
      resize?.disconnect();
      changes?.disconnect();
      const doc = frame.contentDocument;
      const main = doc?.querySelector('main');
      const panel = main?.querySelector(result);
      if (!panel) return;
      ready = true;
      const style = doc.createElement('style');
      style.textContent = `
        html, body { min-width: 0 !important; }
        body { margin: 0 !important; padding: 0 !important; }
        body > :is(header, footer, .skip-link) { display: none !important; }
        body > main { margin: 0 !important; min-height: 0 !important; padding: 12px 0 !important; }
        body:not(.home-diagnosis-result) :is(#audit-title, #assessment-heading) {
          position: absolute !important;
          clip-path: inset(50%);
          width: 1px;
          height: 1px;
          overflow: hidden;
          white-space: nowrap;
        }
        body:not(.home-diagnosis-result) :is(.audit-shell, .readiness-shell) { width: 100% !important; }
        body:not(.home-diagnosis-result) :is(.audit-start, .diagnosis-start, .audit-form-card, .assessment-card) {
          min-height: 0 !important;
          padding: 0 !important;
          background: transparent !important;
          border: 0 !important;
          box-shadow: none !important;
        }
        body:not(.home-diagnosis-result) :is(.audit-start__head, .diagnosis-start__heading) { margin-bottom: 8px !important; }
        body:not(.home-diagnosis-result) #question-fieldset { min-width: 0; }
        body:not(.home-diagnosis-result) .answer-options { gap: 6px; }
        body:not(.home-diagnosis-result) .answer-option {
          min-height: 44px;
          padding: 6px 8px;
        }
        body:not(.home-diagnosis-result) .assessment-navigation {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 8px;
        }
        body:not(.home-diagnosis-result) .assessment-navigation .button {
          min-width: 0;
          min-height: 44px;
          padding: 6px 8px;
        }
        body:not(.home-diagnosis-result) :is(#run-audit, #next-question):not(:disabled) {
          background: #087f82 !important;
          border-color: #087f82 !important;
          color: #fff !important;
          box-shadow: none !important;
        }
        body:not(.home-diagnosis-result) :is(#run-audit, #next-question):not(:disabled):hover {
          background: #066367 !important;
          border-color: #066367 !important;
        }
        body.home-diagnosis-result :is(${input}) { display: none !important; }
        body:not(.home-diagnosis-result) #audit-explanations { display: none !important; }
      `;
      doc.head.append(style);
      retry.onclick = () => { panel.hidden = true; };
      doc.addEventListener('click', event => {
        const anchor = event.target.closest?.('a[href]');
        if (anchor && !anchor.target && !anchor.hasAttribute('download') && !anchor.getAttribute('href').startsWith('#')) {
          anchor.target = '_top';
        }
      });
      doc.addEventListener('keydown', event => {
        if (event.key === 'Escape' && dialog.matches(':modal')) {
          dialog.close();
          link.focus();
        }
      });
      resize = new ResizeObserver(() => {
        if (dialog.open) {
          frame.style.height = main.scrollHeight + 'px';
        }
      });
      resize.observe(main);
      changes = new MutationObserver(() => {
        const showingResult = !panel.hidden;
        doc.body.classList.toggle('home-diagnosis-result', showingResult);
        if (!dialog.open && !showingResult) return;
        if (showingResult) showResult(doc, main);
        else openInput();
      });
      changes.observe(panel, { attributes: true, attributeFilter: ['hidden'] });
    });
  }
})();
</script>
<!-- diagnosis-popups:end -->
